spring.application.name=ReservaAulas

# Configuración de MySQL (crea la BD automáticamente si no existe)
spring.datasource.url=jdbc:mysql://localhost:3306/reserva_aulas?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate (crea y actualiza las tablas automáticamente)
spring.jpa.hibernate.ddl-auto=update

# Para ver las consultas SQL formateadas en la consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true